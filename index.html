<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSL Certificate Watch</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');
    :root { --ink:#18232b; --muted:#68777f; --paper:#f5f6f1; --line:#dbe1d8; --teal:#087f73; --mint:#d9f0e8; --amber:#b46b16; --red:#b63d42; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 92% 0%, #deefe6 0, transparent 30%), var(--paper); font-family:Manrope, sans-serif; }
    .shell { max-width:1440px; margin:auto; padding:32px 28px 54px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:end; border-bottom:1px solid var(--line); padding-bottom:24px; }
    .eyebrow { color:var(--teal); font:500 12px 'DM Mono', monospace; letter-spacing:.12em; text-transform:uppercase; }
    h1 { font-size:clamp(30px,4vw,56px); letter-spacing:-.05em; line-height:1; margin:12px 0 10px; }
    .sub { color:var(--muted); margin:0; }
    .stamp { font:12px 'DM Mono', monospace; color:var(--muted); text-align:right; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:minmax(240px,1fr) auto auto; gap:12px; padding:22px 0; }
    input, select, button { border:1px solid var(--line); border-radius:5px; font:600 13px Manrope, sans-serif; min-height:44px; padding:0 14px; }
    input, select { background:var(--white); color:var(--ink); }
    input:focus, select:focus { outline:2px solid #9bd4c4; outline-offset:1px; }
    button { cursor:pointer; background:var(--ink); color:var(--white); transition:transform .18s, background .18s; }
    button:hover { background:var(--teal); transform:translateY(-1px); }
    button.secondary { background:transparent; color:var(--ink); }
    button:disabled { opacity:.45; cursor:wait; transform:none; }
    .custom { display:grid; grid-template-columns:1fr 120px auto; gap:10px; grid-column:1 / -1; padding-top:2px; }
    .dashboard { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:22px; }
    .metric { background:var(--white); border:1px solid var(--line); padding:18px; min-height:100px; }
    .metric span { color:var(--muted); font-size:12px; display:block; margin-bottom:12px; }
    .metric strong { font:500 30px 'DM Mono', monospace; }
    .table-wrap { background:var(--white); border:1px solid var(--line); overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:920px; }
    th { background:#f0f3ed; color:var(--muted); font:500 11px 'DM Mono', monospace; letter-spacing:.08em; text-align:left; text-transform:uppercase; }
    th, td { padding:14px 16px; border-bottom:1px solid #edf0eb; vertical-align:middle; }
    tbody tr { animation:rise .35s both; }
    tbody tr:hover { background:#fbfcf9; }
    td { font-size:13px; }
    .mono { font-family:'DM Mono', monospace; font-size:12px; }
    .service { font-weight:700; }
    .muted { color:var(--muted); font-size:12px; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border-radius:99px; font-size:11px; font-weight:800; white-space:nowrap; }
    .badge::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .ok { color:var(--teal); background:var(--mint); } .warn { color:var(--amber); background:#fff0d9; } .danger { color:var(--red); background:#fbe3e3; } .idle { color:var(--muted); background:#eef0ec; }
    .empty { padding:52px 20px; text-align:center; color:var(--muted); }
    footer { color:var(--muted); font-size:12px; margin-top:16px; display:flex; justify-content:space-between; gap:12px; }
    @keyframes rise { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
    @media (max-width:760px) { .shell { padding:22px 16px 40px; } header { display:block; } .stamp { text-align:left; margin-top:20px; } .controls { grid-template-columns:1fr; } .custom { grid-template-columns:1fr 100px; } .custom button { grid-column:1 / -1; } .dashboard { grid-template-columns:repeat(2,1fr); } footer { display:block; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">Internal network / TLS inventory</div><h1>SSL Certificate Watch</h1><p class="sub">도메인:포트별 인증서 등록일과 만료기한을 확인합니다.</p></div>
      <div class="stamp" id="updated">SOURCE · 업무망_내부.md</div>
    </header>
    <section class="controls" aria-label="조회 조건">
      <input id="search" type="search" placeholder="서비스, 도메인, 시스템 검색" aria-label="검색">
      <select id="statusFilter" aria-label="상태 필터"><option value="all">전체 상태</option><option value="idle">미조회</option><option value="ok">정상</option><option value="warn">30일 이내 만료</option><option value="danger">만료 또는 오류</option></select>
      <button id="checkVisible">미조회 항목 조회</button>
      <div class="custom"><input id="customHost" placeholder="직접 조회할 도메인 (예: www.example.com)" aria-label="직접 조회 도메인"><input id="customPort" type="number" min="1" max="65535" value="443" aria-label="직접 조회 포트"><button id="checkCustom" class="secondary">직접 조회</button></div>
    </section>
    <section class="dashboard" aria-label="요약"><div class="metric"><span>등록된 엔드포인트</span><strong id="total">—</strong></div><div class="metric"><span>조회 완료</span><strong id="checked">—</strong></div><div class="metric"><span>정상 인증서</span><strong id="healthy">—</strong></div><div class="metric"><span>주의 필요</span><strong id="attention">—</strong></div></section>
    <section class="table-wrap"><table><thead><tr><th>서비스</th><th>도메인:포트</th><th>환경</th><th>인증서 등록일</th><th>만료기한</th><th>상태</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">목록을 불러오는 중입니다.</td></tr></tbody></table></section>
    <footer><span>실행 명령: echo | openssl s_client -connect 도메인:포트 -servername 도메인 2&gt;/dev/null | openssl x509 -noout -dates</span><span>OpenSSL backend</span></footer>
  </main>
<script>
  const state = { targets: [], results: new Map(), busy: new Set() };
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const statusOf = (result) => { if (!result) return 'idle'; if (result.error) return 'danger'; if (result.daysRemaining !== null && result.daysRemaining < 0) return 'danger'; if (result.daysRemaining !== null && result.daysRemaining <= 30) return 'warn'; return 'ok'; };
  const statusText = { idle:'미조회', ok:'정상', warn:'30일 이내', danger:'확인 필요' };
  function render() {
    const query = $('search').value.trim().toLowerCase(); const filter = $('statusFilter').value;
    const visible = state.targets.filter((target) => { const result = state.results.get(target.id); const haystack = `${target.service} ${target.system} ${target.address} ${target.hostname}`.toLowerCase(); return (!query || haystack.includes(query)) && (filter === 'all' || statusOf(result) === filter); });
    $('total').textContent = state.targets.length; $('checked').textContent = [...state.results.values()].length; $('healthy').textContent = [...state.results.values()].filter((r) => statusOf(r) === 'ok').length; $('attention').textContent = [...state.results.values()].filter((r) => ['warn','danger'].includes(statusOf(r))).length;
    $('rows').innerHTML = visible.length ? visible.map((target, index) => { const result = state.results.get(target.id); const status = statusOf(result); const isBusy = state.busy.has(target.id); const source = result?.source === 'windows-powershell' ? 'Windows 반입 결과' : result ? 'Linux 실시간 조회' : ''; return `<tr style="animation-delay:${Math.min(index, 15) * 18}ms"><td><div class="service">${escapeHtml(target.name)}</div><div class="muted">${escapeHtml(target.service || target.system)}</div></td><td><div class="mono">${escapeHtml(target.address)}</div><div class="muted">${escapeHtml(target.system)} · ${escapeHtml(target.environment)}</div></td><td>${escapeHtml(target.network)}<br><span class="muted">${escapeHtml(target.environment)}</span></td><td class="mono">${result?.notBefore ? escapeHtml(result.notBefore) : '—'}</td><td class="mono">${result?.notAfter ? escapeHtml(result.notAfter) : '—'}${result?.daysRemaining !== null && result?.daysRemaining !== undefined ? `<br><span class="muted">${result.daysRemaining}일 남음</span>` : ''}</td><td><span class="badge ${status}">${statusText[status]}</span><div class="muted">${source}</div>${result?.error ? `<div class="muted" title="${escapeHtml(result.error)}">${escapeHtml(result.error).slice(0, 28)}${result.error.length > 28 ? '…' : ''}</div>` : ''}</td><td><button class="secondary row-check" data-id="${escapeHtml(target.id)}" ${isBusy ? 'disabled' : ''}>${isBusy ? '조회 중' : result?.source === 'windows-powershell' ? 'Linux 재조회' : '조회'}</button></td></tr>`; }).join('') : '<tr><td colspan="7" class="empty">조건에 맞는 대상이 없습니다.</td></tr>';
  }
  async function check(target) { state.busy.add(target.id); render(); try { const response = await fetch('/api/check', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ hostname:target.hostname, port:target.port }) }); const data = await response.json(); state.results.set(target.id, data.ok ? data : { error:data.error || '조회 실패' }); } catch (error) { state.results.set(target.id, { error:'서버 연결 실패' }); } finally { state.busy.delete(target.id); render(); } }
  $('rows').addEventListener('click', (event) => { const button = event.target.closest('.row-check'); if (button) { const target = state.targets.find((item) => item.id === button.dataset.id); if (target) check(target); } });
  $('search').addEventListener('input', render); $('statusFilter').addEventListener('change', render);
  $('checkVisible').addEventListener('click', async () => { const query = $('search').value.trim().toLowerCase(); const targets = state.targets.filter((target) => { const matches = !query || `${target.service} ${target.system} ${target.address} ${target.hostname}`.toLowerCase().includes(query); const result = state.results.get(target.id); return matches && result?.source !== 'windows-powershell'; }); $('checkVisible').disabled = true; await Promise.all(targets.map(check)); $('checkVisible').disabled = false; });
  $('checkCustom').addEventListener('click', async () => { const hostname = $('customHost').value.trim(); const port = Number($('customPort').value); if (!hostname || !port) return; const id = `custom-${hostname}-${port}`; const target = { id, name:'직접 조회', service:'수동 입력', system:'사용자 지정', environment:'-', network:'-', hostname, port, address:`${hostname}:${port}` }; if (!state.targets.some((item) => item.id === id)) state.targets.unshift(target); await check(target); });
  async function refreshData() { try { const response = await fetch('/api/targets', { cache:'no-store' }); const data = await response.json(); state.targets = data.targets; Object.entries(data.snapshot?.results || {}).forEach(([id, result]) => state.results.set(id, result)); const snapshotDate = data.snapshot?.generatedAt ? ` · 결과 ${data.snapshot.generatedAt}` : ''; const autoStatus = data.autoCheck?.running ? ` · Linux 자동조회 ${data.autoCheck.checked}/${data.autoCheck.total}` : ''; $('updated').textContent = `SOURCE · 업무망_내부.md · ${state.targets.length} endpoints${snapshotDate}${autoStatus}`; render(); } catch (error) { $('rows').innerHTML = '<tr><td colspan="7" class="empty">서버에서 대상 목록을 불러오지 못했습니다.</td></tr>'; } }
  refreshData();
</script>
</body>
</html>
